[workspace]
resolver = "2"
members = [
    "crates/lms-cache",
    "crates/lms-image",
    "crates/lms-gdresized",
    "crates/lms-transcode",
    "crates/lms-mp3cut",
    "crates/lms-audioscan",
    "crates/lms-scanner-accel",
]

[workspace.dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
lofty = { version = "0.21", default-features = false }
md-5 = "0.10"
rayon = "1.10"
rubato = "0.15"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3.12"
thiserror = "1.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

